name: Build php_opcodedump.dll

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019  # Has VS2019 with MSVC 14.29

    steps:
    - uses: actions/checkout@v4

    - name: Download PHP 8.1 devel pack
      shell: powershell
      run: |
        $url = "https://windows.php.net/downloads/releases/archives/php-devel-pack-8.1.34-nts-Win32-vs16-x86.zip"
        Invoke-WebRequest -Uri $url -OutFile php-devel.zip
        Expand-Archive php-devel.zip -DestinationPath build\devel\
        Move-Item "build\devel\php-8.1.34-devel-vs16-x86" "build\devel\php-8.1.34-devel-vs16-x86" -ErrorAction SilentlyContinue

    - name: Setup VS2019 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
        vsversion: 2019

    - name: Build extension
      shell: cmd
      run: |
        set SRC=%CD%\src
        set OUT=%CD%\build\out
        set PHP_INC=%CD%\build\devel\php-8.1.34-devel-vs16-x86\include
        set PHP_LIB=%CD%\build\devel\php-8.1.34-devel-vs16-x86\lib

        if not exist "%OUT%" mkdir "%OUT%"

        cl.exe /nologo /c /MD /O2 /W3 /wd4996 ^
          /DWIN32 /D_WINDOWS /DZEND_WIN32=1 /DPHP_WIN32=1 ^
          /DCOMPILE_DL_OPCODEDUMP /DZEND_DEBUG=0 ^
          /I"%PHP_INC%" /I"%PHP_INC%\main" /I"%PHP_INC%\Zend" ^
          /I"%PHP_INC%\TSRM" /I"%PHP_INC%\win32" /I"%PHP_INC%\ext" ^
          /Fo"%OUT%\opcodedump.obj" ^
          "%SRC%\opcodedump.c"

        link.exe /nologo /DLL ^
          /OUT:"%OUT%\php_opcodedump.dll" ^
          /LIBPATH:"%PHP_LIB%" ^
          "%OUT%\opcodedump.obj" ^
          php8.lib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: php_opcodedump
        path: build/out/php_opcodedump.dll
